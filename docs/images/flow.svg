<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Query request flow"><rect width="1280" height="330" rx="16" fill="#0b1220"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="52" fill="#83aeff" font-size="15" letter-spacing="2">REQUEST FLOW</text><rect x="40" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="62" y="131" fill="#83aeff" font-size="20" font-weight="600">Authorize</text><text x="62" y="163" fill="#a7b8cf" font-size="14">Before every lookup</text><path d="M322 144h19m-5-5 5 5-5 5" stroke="#83aeff" fill="none" stroke-width="2"/><rect x="347" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="369" y="131" fill="#83aeff" font-size="20" font-weight="600">Scoped cache</text><text x="369" y="163" fill="#a7b8cf" font-size="14">Memory → optional GCS</text><path d="M629 144h19m-5-5 5 5-5 5" stroke="#83aeff" fill="none" stroke-width="2"/><rect x="654" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="676" y="131" fill="#83aeff" font-size="20" font-weight="600">Dry run</text><text x="676" y="163" fill="#a7b8cf" font-size="14">Estimate scan bytes</text><path d="M936 144h19m-5-5 5 5-5 5" stroke="#83aeff" fill="none" stroke-width="2"/><rect x="961" y="90" width="275" height="108" rx="12" fill="#111d31" stroke="#aeed8b" stroke-opacity=".6"/><text x="983" y="131" fill="#aeed8b" font-size="20" font-weight="600">Execute</text><text x="983" y="163" fill="#a7b8cf" font-size="14">BigQuery byte cap</text><text x="40" y="253" fill="#cbd9ec" font-size="16">A cache hit returns early. Missing permission or an oversized estimate stops the request.</text><text x="40" y="288" fill="#849cbd" font-size="14">Cache identity includes SQL, parameters, types, scope, publication, location and engine namespace.</text></g></svg>
