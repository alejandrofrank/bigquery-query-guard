<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-label="BigQuery Query Guard">
 <defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#5888c5" opacity=".2"/></pattern><linearGradient id="fade"><stop stop-color="#0c172b"/><stop offset="1" stop-color="#101e34"/></linearGradient></defs>
 <rect width="1400" height="660" fill="#080d18"/><rect x="720" width="680" height="660" fill="url(#fade)"/><rect x="720" width="680" height="660" fill="url(#dots)"/>
 <g font-family="Arial,Helvetica,sans-serif"><text x="65" y="70" fill="#c3d8f9" font-size="23">Bakiano <tspan fill="#6689ba">/ open source</tspan></text>
 <text x="65" y="167" fill="#83aeff" font-family="monospace" font-size="13" letter-spacing="2">02 / DATA INFRASTRUCTURE</text>
 <text x="65" y="234" fill="#f0f5ff" font-size="47" font-weight="700" letter-spacing="-2">BigQuery Query Guard</text><text x="65" y="282" fill="#a4b5ce" font-size="22">Authorize. Reuse. Estimate. Enforce.</text>
 <rect x="65" y="345" width="265" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="87" y="386" fill="#83aeff" font-size="20" font-weight="600">Application request</text><text x="87" y="418" fill="#a7b8cf" font-size="14">Reviewed SQL + parameters</text><rect x="376" y="345" width="270" height="108" rx="12" fill="#111d31" stroke="#aeed8b" stroke-opacity=".6"/><text x="398" y="386" fill="#aeed8b" font-size="20" font-weight="600">Guarded execution</text><text x="398" y="418" fill="#a7b8cf" font-size="14">Scope + version + byte cap</text><path d="M333 399h30" stroke="#83aeff" stroke-width="2"/><text x="65" y="506" fill="#a4b5ce" font-size="17">Real library. Interactive offline sandbox.</text><rect x="795" y="120" width="510" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="817" y="161" fill="#83aeff" font-size="20" font-weight="600">L1 · Memory</text><text x="817" y="193" fill="#a7b8cf" font-size="14">Reuse on the same application instance</text><rect x="795" y="254" width="510" height="108" rx="12" fill="#111d31" stroke="#83aeff" stroke-opacity=".6"/><text x="817" y="295" fill="#83aeff" font-size="20" font-weight="600">L2 · Cloud Storage</text><text x="817" y="327" fill="#a7b8cf" font-size="14">Optional shared cache across instances</text><rect x="795" y="388" width="510" height="108" rx="12" fill="#111d31" stroke="#aeed8b" stroke-opacity=".6"/><text x="817" y="429" fill="#aeed8b" font-size="20" font-weight="600">BigQuery</text><text x="817" y="461" fill="#a7b8cf" font-size="14">Dry run → maximumBytesBilled</text><path d="M1050 228v26M1050 362v26" stroke="#83aeff" stroke-width="2"/>
